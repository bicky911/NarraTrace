name: NarraTrace CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: npm run test:syntax

      - name: Run unit tests
        run: npm test

      - name: Run source-structure checks
        run: npm run test:static

      - name: Validate release package contents
        run: npm run package:check

      - name: Build clean unpacked-extension archive
        run: npm run package:build

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: narratrace-extension-package
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  browser-integration:
    name: Browser integration and performance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser-test tooling
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Run extension browser tests
        run: npm run test:e2e

      - name: Upload browser diagnostics on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: narratrace-browser-test-results
          path: test-results/
          if-no-files-found: ignore

