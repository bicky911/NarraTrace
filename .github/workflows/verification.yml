name: NarraTrace Verification

on:
  # Feature/reliability branches are verified through their pull requests.
  # Only main pushes need a separate push-triggered run.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: narratrace-verification-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-verification:
    name: NarraTrace regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run playback transition regression tests
        run: node --test tests/playback-manager.test.mjs
      - name: Install pinned browser-test dependency
        run: npm install --prefix tests/browser --no-save --no-package-lock puppeteer@24.8.1
      - name: Run Chrome service-worker recovery test
        run: node --test tests/browser/service-worker-recovery.test.mjs
      - name: Run verification harness
        run: python test-harness.py
