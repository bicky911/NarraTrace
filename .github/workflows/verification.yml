name: NarraTrace Verification

on:
  push:
    branches: ["main", "reliability/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-verification:
    name: NarraTrace regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run playback transition regression tests
        run: node --test tests/playback-manager.test.mjs
      - name: Run verification harness
        run: python test-harness.py
